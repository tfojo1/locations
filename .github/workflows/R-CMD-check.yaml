on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Validate raw-data source manifest
        run: Rscript code_for_building_package/validate_source_manifest.R

      - name: Validate known data issues
        run: Rscript code_for_building_package/validate_known_data_issues.R

      - name: Validate deterministic temporal county build
        run: Rscript code_for_building_package/validate_temporal_county_build.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
